name: build-bootimg
run-name: vanilla 6.16.7 boot.img
on:
  workflow_dispatch:

env:
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev cpio ccache

      - name: restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('bootpack/config-6.16.7') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('bootpack/config-6.16.7') }}-
            ccache-${{ runner.os }}-

      - name: configure
        run: |
          mkdir -p ~/.cache/ccache
          ccache --set-config=cache_dir="$HOME/.cache/ccache"
          cp bootpack/config-6.16.7 .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache aarch64-linux-gnu-gcc" olddefconfig
          (diff -u bootpack/config-6.16.7 .config > config-drift.diff || true)

      - name: build kernel + dtb
        run: |
          LOCALVERSION= make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache aarch64-linux-gnu-gcc" -j"$(nproc)" Image.gz qcom/sm8250-oneplus-instantnoodle.dtb
          REL=$(LOCALVERSION= make -s kernelrelease)
          echo "kernelrelease=$REL"
          test "$REL" = "6.16.7" || { echo "ERROR: kernelrelease must be exactly 6.16.7, got $REL"; exit 1; }
          ls -la arch/arm64/boot/Image.gz arch/arm64/boot/dts/qcom/sm8250-oneplus-instantnoodle.dtb
          ccache -s | tee ccache-stats.txt

      - name: pack boot images
        run: |
          set -e
          DTB=arch/arm64/boot/dts/qcom/sm8250-oneplus-instantnoodle.dtb
          # netconsole over USB gadget ethernet; IPs assembled from octets on purpose
          A=172; B=16; C=42; D=5   # phone src
          E=172; F=16; G=42; H=6   # PC receiver (udev gives it ${E}.${F}.${G}.${H}/30)
          CMDLINE="root=/dev/sda24 rw console=tty0 ignore_loglevel loglevel=8 netconsole=6666@${A}.${B}.${C}.${D}/usb0,6666@${E}.${F}.${G}.${H}/ softlockup_panic=1 hung_task_panic=1 nmi_watchdog=1 hardlockup_panic=1 panic=15"
          cat arch/arm64/boot/Image.gz "$DTB" > Image.gz-dtb
          # inject init-bottom script that dumps dmesg to /var/log/early-dmesg.txt
          mkdir -p rd
          (cd rd && gzip -dc ../bootpack/ramdisk_from_boot.img | cpio -idm --quiet)
          install -m755 bootpack/init-bottom-save-dmesg rd/scripts/init-bottom/save-dmesg
          grep -q 'init-bottom/save-dmesg' rd/scripts/init-bottom/ORDER || printf '\n/scripts/init-bottom/save-dmesg "$@"\n' >> rd/scripts/init-bottom/ORDER
          # bring usb0 (g_ether built-in) UP so netconsole can send from initramfs
          printf '%s\n' \
            '#!/bin/sh' \
            'PREREQ=""' \
            'prereqs() { echo "$PREREQ"; }' \
            'case "$1" in prereqs) prereqs; exit 0;; esac' \
            '[ -e /sys/class/net/usb0 ] && /sbin/ip link set usb0 up' \
            '[ -e /sys/class/net/usb0 ] && /sbin/ip addr add 172.16.42.5/16 dev usb0' \
            'exit 0' \
            > rd/scripts/init-bottom/00-netconsole-up
          chmod 755 rd/scripts/init-bottom/00-netconsole-up
          # run it FIRST in init-bottom, before udev
          if grep -q '00-netconsole-up' rd/scripts/init-bottom/ORDER; then
            echo 'netconsole-up already in ORDER'
          else
            printf '/scripts/init-bottom/00-netconsole-up "$@"\n' > rd/tmp_ORDER
            cat rd/scripts/init-bottom/ORDER >> rd/tmp_ORDER
            mv rd/tmp_ORDER rd/scripts/init-bottom/ORDER
          fi
          echo '--- init-bottom ORDER ---'; cat rd/scripts/init-bottom/ORDER
          (cd rd && find . -print0 | cpio --null -o -H newc --owner=0:0 --quiet | gzip -9 > ../ramdisk-initrd.img)
          python3 bootpack/pack_bootimg.py --kernel Image.gz-dtb --ramdisk ramdisk-initrd.img --cmdline "$CMDLINE" --output boot.img
          cat arch/arm64/boot/Image.gz bootpack/dtb_appended.dtb > Image.gz-refdtb
          python3 bootpack/pack_bootimg.py --kernel Image.gz-refdtb --ramdisk ramdisk-initrd.img --cmdline "$CMDLINE" --output boot-refdtb.img
          cp "$DTB" sm8250-oneplus-instantnoodle-built.dtb

      - name: upload kernel artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/qcom/sm8250-oneplus-instantnoodle.dtb
            .config
            config-drift.diff
            ccache-stats.txt
          if-no-files-found: warn

      - name: upload boot images (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-img
          path: |
            boot.img
            boot-refdtb.img
            Image.gz-dtb
            Image.gz-refdtb
            sm8250-oneplus-instantnoodle-built.dtb
          if-no-files-found: warn
